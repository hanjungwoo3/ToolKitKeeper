plugins {
    id 'com.android.application'
}

android {
    namespace 'com.questhelper.tkkeeper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.questhelper.tkkeeper'
        minSdk 29
        targetSdk 33
        // CI passes the run number / tag so every build can be installed over the previous one
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        // CI: keystore decoded from the KEYSTORE_BASE64 secret. Local: falls back to the debug key.
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure-JVM ADB client: lets the app talk to the headset's own adbd on 127.0.0.1:5555
    implementation 'dev.mobile:dadb:1.2.10'
}
